<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facility Issues – Completion Rate</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', system-ui, sans-serif;
  background: #f1f0ed; color: #1a1916;
  padding: 14px;
}
.card {
  background: #fff; border: 1px solid #e0deda; border-radius: 10px;
  padding: 16px 18px 14px;
}
.top {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: 16px; flex-wrap: wrap; margin-bottom: 12px;
}
.label { font-size: 13px; font-weight: 600; color: #6b6964; margin-bottom: 2px; }
.rate { font-size: 40px; font-weight: 700; line-height: 1; letter-spacing: -0.01em; }
.rate .pct { font-size: 22px; font-weight: 600; margin-left: 1px; }
.of { font-size: 14px; color: #44423e; text-align: right; line-height: 1.4; }
.of b { font-weight: 700; color: #1a1916; }

.bar {
  display: flex; height: 14px; border-radius: 7px; overflow: hidden;
  background: #ebe9e5;
}
.seg { height: 100%; transition: width .3s ease; }

.legend {
  display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px;
  font-size: 13px;
}
.item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.dot { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.item .n { font-family: 'DM Mono', monospace; font-size: 12px; color: #44423e; }

.empty { font-size: 13px; color: #8a8782; padding: 8px 0; }
@media (prefers-reduced-motion: reduce) { .seg { transition: none; } }
</style>
</head>
<body>
<div class="card">
  <div class="top">
    <div>
      <div class="label">Overall completion rate</div>
      <div class="rate" id="rate">–</div>
    </div>
    <div class="of" id="of"></div>
  </div>
  <div class="bar" id="bar" role="img" aria-label="Tickets by status"></div>
  <div class="legend" id="legend"></div>
  <div class="empty" id="empty" style="display:none">No tickets yet.</div>
</div>

<script>
  // Status order and colours match the Status column.
  // "Done" statuses count toward the completion rate.
  const STATUSES = [
    { key: 'Resolved',               color: '#126E0E', done: true  },
    { key: 'Closed - No Resolution', color: '#5F5E5A', done: true  },
    { key: 'In Progress',            color: '#F2C94C', done: false },
    { key: 'Open',                   color: '#F4A3A0', done: false },
  ];

  grist.ready({ requiredAccess: 'read table' });

  grist.onRecords(records => render(records || []));

  function render(records) {
    const counts = Object.fromEntries(STATUSES.map(s => [s.key, 0]));
    let other = 0;
    for (const r of records) {
      const st = String(r.Status || '').trim();
      if (st in counts) counts[st]++; else other++;
    }
    const total = records.length;
    const done = STATUSES.filter(s => s.done).reduce((n, s) => n + counts[s.key], 0);

    const bar = document.getElementById('bar');
    const legend = document.getElementById('legend');
    const empty = document.getElementById('empty');

    if (!total) {
      document.getElementById('rate').textContent = '–';
      document.getElementById('of').textContent = '';
      bar.innerHTML = ''; legend.innerHTML = '';
      empty.style.display = '';
      return;
    }
    empty.style.display = 'none';

    const rate = Math.round(done / total * 100);
    document.getElementById('rate').innerHTML = `${rate}<span class="pct">%</span>`;
    document.getElementById('of').innerHTML =
      `<b>${done}</b> of <b>${total}</b> tickets closed<br>` +
      `<b>${total - done}</b> still unresolved`;

    const parts = STATUSES.map(s => ({ ...s, n: counts[s.key] }));
    if (other) parts.push({ key: 'No status', color: '#cfcac3', n: other });

    bar.innerHTML = parts.filter(p => p.n)
      .map(p => `<div class="seg" style="width:${p.n / total * 100}%;background:${p.color}" title="${p.key}: ${p.n}"></div>`)
      .join('');
    bar.setAttribute('aria-label', parts.map(p => `${p.key} ${p.n}`).join(', '));

    legend.innerHTML = parts
      .map(p => `<span class="item"><span class="dot" style="background:${p.color}"></span>${p.key} <span class="n">${p.n} · ${Math.round(p.n / total * 100)}%</span></span>`)
      .join('');
  }
</script>
</body>
</html>
