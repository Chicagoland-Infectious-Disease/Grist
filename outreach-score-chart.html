<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Outreach Score Chart</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: #f1f0ed;
  color: #1a1916;
  padding: 16px;
  min-height: 100vh;
}
.head {
  display: flex; align-items: baseline; justify-content: space-between;
  gap: 12px; flex-wrap: wrap; margin-bottom: 14px;
}
.title {
  font-family: 'DM Mono', monospace; font-size: 12px; font-weight: 500;
  text-transform: uppercase; letter-spacing: 0.07em; color: #aaa;
}
.month {
  font-size: 18px; font-weight: 600; color: #1a1916;
}
.meta {
  font-family: 'DM Mono', monospace; font-size: 12px; color: #777;
}
.meta b { color: #1a1916; font-weight: 500; }

.chart {
  position: relative;
  background: #fff; border: 1px solid #e0deda; border-radius: 10px;
  padding: 18px 16px 10px;
}
/* Top padding is set from JS to the height of the breakdown box, so bars never run under it */

.bars {
  display: grid;
  grid-template-columns: repeat(var(--n), 1fr);
  gap: 14px;
  align-items: end;
  height: 180px;
  border-bottom: 1px solid #e0deda;
  padding-bottom: 0;
}
.col { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; }
.val {
  font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
  margin-bottom: 4px; color: #1a1916;
}
.val.zero { color: #bbb; }
.bar {
  width: 100%; max-width: 72px; border-radius: 6px 6px 0 0;
  transition: height 0.25s ease;
  min-height: 2px;
}
.bar.zero { background: #ebe9e5 !important; }
.labels {
  display: grid;
  grid-template-columns: repeat(var(--n), 1fr);
  gap: 14px; margin-top: 8px;
}
.lbl {
  text-align: center; font-size: 12px; color: #444; line-height: 1.25;
}
.lbl .pct {
  display: block; font-family: 'DM Mono', monospace; font-size: 11px; color: #999; margin-top: 2px;
}
.empty {
  padding: 36px; text-align: center; color: #aaa;
  font-family: 'DM Mono', monospace; font-size: 13px;
}

/* Follow-up breakdown — top-left corner of the chart's white space */
.who {
  position: absolute;
  top: 12px; left: 16px; right: 16px;
  z-index: 2;
  font-size: 13px; color: #000; font-weight: 700; line-height: 1.5;
}
.who-title {
  font-family: 'DM Mono', monospace; font-size: 11px; font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.07em; color: #000;
  margin-bottom: 1px;
}
.who-item { display: inline-block; margin-right: 16px; white-space: nowrap; color: #000; font-weight: 700; }
.who-item b { font-weight: 700; color: #000; }
.who-item .n, .fu-item .n { font-family: 'DM Mono', monospace; font-size: 12px; color: #000; font-weight: 700; }
.who-item.none, .who-item.none b { color: #000; }

.who-section {
  width: fit-content; max-width: 100%;
  padding: 5px 10px 6px;
  border-radius: 6px;
  border-left: 4px solid transparent;
}
.who-section + .who-section { margin-top: 6px; }
/* Each breakdown gets its own tint so the two lines are easy to tell apart */
#fuSection  { background: #E6F2FB; border-left-color: #2B7BC0; }
.fu-item { display: inline-flex; align-items: center; gap: 5px; margin-right: 14px; white-space: nowrap; }
.chip {
  display: inline-block; padding: 1px 7px; border-radius: 4px;
  font-size: 12px; font-weight: 700; line-height: 1.5;
}
.chip.none { background: #ebe9e5; color: #000; }
</style>
</head>
<body>

<div class="head">
  <div>
    <div class="title">Outreach score</div>
    <div class="month" id="month">—</div>
  </div>
  <div class="meta" id="meta"></div>
</div>

<div class="chart" id="chart">
  <div class="who" id="who" style="display:none">
    <div class="who-section" id="fuSection">
      <div class="who-title">Follow up required this month</div>
      <div id="fuList"></div>
    </div>
  </div>
  <div class="empty" id="empty">Select a month…</div>
  <div class="bars" id="bars" style="display:none"></div>
  <div class="labels" id="labels" style="display:none"></div>
</div>

<script>
  // Score categories, in display order, with the same colours as the Score choice column.
  const CATEGORIES = [
    { key: 'Poor',      label: '1 - Poor',       color: '#E00A17' },
    { key: 'Fair',      label: '2 - Fair',       color: '#FD8182' },
    { key: 'Good',      label: '3 - Good',       color: '#FECBCC' },
    { key: 'VeryGood',  label: '4 - Very Good',  color: '#7ED321' },
    { key: 'Excellent', label: '5 - Excellent',  color: '#126E0E' },
    { key: 'NoScore',   label: 'Contacted, no score', color: '#cfcac3', optional: true },
  ];

  // Outreach rows live in this table; each has a Month reference and a Follow Up choice list.
  const OUTREACH_TABLE = 'Facility_Outreach';
  const MONTH_REF_COL = 'Month';
  const FOLLOW_UP_COL = 'Follow_Up_Required_This_Month';   // ChoiceList

  // Same options and colours as the Follow Up Required This Month choice column.
  const FOLLOW_UP_CHOICES = [
    { key: 'Yes',                      fill: '#2AE028', text: '#000000' },
    { key: 'No',                       fill: '#E00A17', text: '#FFFFFF' },
    { key: 'Outcome - Improvement',    fill: '#126E0E', text: '#FFFFFF' },
    { key: 'Outcome - No Improvement', fill: '#740206', text: '#FFFFFF' },
  ];

  grist.ready({
    requiredAccess: 'read table',
    columns: [
      { name: 'Month',     title: 'Month label',            type: 'Text' },
      { name: 'Poor',      title: '1 - Poor (count)',       type: 'Int,Numeric' },
      { name: 'Fair',      title: '2 - Fair (count)',       type: 'Int,Numeric' },
      { name: 'Good',      title: '3 - Good (count)',       type: 'Int,Numeric' },
      { name: 'VeryGood',  title: '4 - Very Good (count)',  type: 'Int,Numeric' },
      { name: 'Excellent', title: '5 - Excellent (count)',  type: 'Int,Numeric' },
      { name: 'NoScore',   title: 'Contacted, no score (count)', type: 'Int,Numeric', optional: true },
      { name: 'Total',     title: 'Outreach count (optional)',   type: 'Int,Numeric', optional: true },
    ],
  });

  grist.onRecord((record, mappings) => {
    const r = grist.mapColumnNames(record, mappings);
    if (!r) { showEmpty('Map the columns in the widget panel →'); return; }
    render(r);
    renderWho(record.id);   // the selected Month row's id
  });

  function setWhoVisible(show) {
    const box = document.getElementById('who');
    const chart = document.getElementById('chart');
    box.style.display = show ? '' : 'none';
    chart.style.paddingTop = show ? (box.offsetHeight + 22) + 'px' : '';
  }
  // Keep the reserved space right if the widget is resized and the lines wrap.
  window.addEventListener('resize', () => {
    if (document.getElementById('who').style.display !== 'none') setWhoVisible(true);
  });

  function showEmpty(msg) {
    document.getElementById('empty').textContent = msg;
    document.getElementById('empty').style.display = '';
    document.getElementById('bars').style.display = 'none';
    document.getElementById('labels').style.display = 'none';
    setWhoVisible(false);
    document.getElementById('month').textContent = '—';
    document.getElementById('meta').textContent = '';
  }

  function num(v) { const n = Number(v); return isFinite(n) ? n : 0; }

  function render(r) {
    const cats = CATEGORIES.filter(c => !c.optional || r[c.key] !== undefined && r[c.key] !== null);
    const values = cats.map(c => num(r[c.key]));
    const scored = cats.filter(c => c.key !== 'NoScore')
                       .reduce((s, c) => s + num(r[c.key]), 0);
    const max = Math.max(1, ...values);

    document.getElementById('month').textContent = r.Month || '—';

    const metaParts = [];
    if (r.Total !== undefined && r.Total !== null) metaParts.push(`<b>${num(r.Total)}</b> outreach`);
    metaParts.push(`<b>${scored}</b> scored`);
    document.getElementById('meta').innerHTML = metaParts.join(' · ');

    const bars = document.getElementById('bars');
    const labels = document.getElementById('labels');
    bars.innerHTML = ''; labels.innerHTML = '';
    bars.style.setProperty('--n', cats.length);
    labels.style.setProperty('--n', cats.length);

    cats.forEach((c, i) => {
      const v = values[i];
      const col = document.createElement('div');
      col.className = 'col';

      const val = document.createElement('div');
      val.className = 'val' + (v === 0 ? ' zero' : '');
      val.textContent = v;
      col.appendChild(val);

      const bar = document.createElement('div');
      bar.className = 'bar' + (v === 0 ? ' zero' : '');
      bar.style.background = c.color;
      bar.style.height = Math.round((v / max) * 100) + '%';
      bar.title = `${c.label}: ${v}`;
      col.appendChild(bar);
      bars.appendChild(col);

      const lbl = document.createElement('div');
      lbl.className = 'lbl';
      const pct = (c.key !== 'NoScore' && scored > 0) ? Math.round(v / scored * 100) + '%' : '';
      lbl.innerHTML = `${c.label}${pct ? `<span class="pct">${pct} of scored</span>` : ''}`;
      labels.appendChild(lbl);
    });

    document.getElementById('empty').style.display = 'none';
    bars.style.display = '';
    labels.style.display = '';
  }

  // Follow up required this month breakdown for the selected month's outreach rows.
  let whoRequest = 0;
  async function renderWho(monthId) {
    const myRequest = ++whoRequest;   // ignore stale responses if the user clicks quickly
    try {
      const t = await grist.docApi.fetchTable(OUTREACH_TABLE);
      if (myRequest !== whoRequest) return;

      let total = 0;
      const fuCounts = new Map();
      let fuNotRecorded = 0;
      const fuCol = t[FOLLOW_UP_COL];
      for (let i = 0; i < t.id.length; i++) {
        if (t[MONTH_REF_COL][i] !== monthId) continue;
        total++;
        // ChoiceList cells arrive as ['L', 'Yes', ...]; a row can hold more than one option.
        if (fuCol) {
          const raw = fuCol[i];
          const picks = Array.isArray(raw) ? raw.slice(raw[0] === 'L' ? 1 : 0)
                       : (raw ? [String(raw)] : []);
          const uniq = [...new Set(picks.map(v => String(v).trim()).filter(Boolean))];
          if (!uniq.length) fuNotRecorded++;
          uniq.forEach(v => fuCounts.set(v, (fuCounts.get(v) || 0) + 1));
        }
      }

      if (total === 0) { setWhoVisible(false); return; }

      const pct = n => Math.round(n / total * 100) + '%';
      // Follow up required this month — options in choice order, then any unexpected values.
      const fuSection = document.getElementById('fuSection');
      if (fuCol) {
        const known = new Set(FOLLOW_UP_CHOICES.map(c => c.key));
        const fuItems = FOLLOW_UP_CHOICES
          .filter(c => fuCounts.get(c.key))
          .map(c => fuChip(c.key, fuCounts.get(c.key), pct, c.fill, c.text));
        [...fuCounts.entries()]
          .filter(([k]) => !known.has(k))
          .forEach(([k, n]) => fuItems.push(fuChip(k, n, pct, '#ebe9e5', '#000')));
        if (fuNotRecorded) {
          fuItems.push(`<span class="fu-item"><span class="chip none">Not recorded</span> ${pct(fuNotRecorded)} <span class="n">(${fuNotRecorded})</span></span>`);
        }
        document.getElementById('fuList').innerHTML = fuItems.join('');
        fuSection.style.display = '';
      } else {
        setWhoVisible(false);   // no follow-up column: hide the box entirely
        return;
      }

      setWhoVisible(true);
    } catch (e) {
      setWhoVisible(false);
      console.error('Follow up breakdown:', e);
    }
  }

  function fuChip(label, n, pct, fill, text) {
    return `<span class="fu-item"><span class="chip" style="background:${fill};color:${text}">${escapeHtml(label)}</span> ${pct(n)} <span class="n">(${n})</span></span>`;
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
  }
</script>
</body>
</html>
