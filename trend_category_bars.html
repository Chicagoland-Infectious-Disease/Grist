<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trend Category Bars</title>
<script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
<style>
  :root {
    --down:  #E00A17;
    --flat:  #157AFB;
    --up:    #126E0E;
    --none:  #9E9E9E;
    --ink:   #1a1a1a;
    --muted: #6b6b6b;
    --track: #00000010;
    --rule:  #00000018;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #f0f0f0; --muted: #a0a0a0; --track: #ffffff14; --rule: #ffffff22; }
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    padding: 14px 16px;
    font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--ink);
    background: transparent;
    display: flex;
    flex-direction: column;
  }

  #total {
    color: var(--muted);
    font-size: 12px;
    margin-bottom: 10px;
  }

  /* Bars area grows with the widget; never shorter than 160px. */
  #chart {
    flex: 1;
    min-height: 160px;
    display: grid;
    grid-template-rows: 1fr auto;
  }

  .plot {
    display: grid;
    grid-template-columns: repeat(var(--n), 1fr);
    gap: 14px;
    align-items: end;
    border-bottom: 1px solid var(--rule);
    min-height: 0;
  }

  /* Each column reserves room at the top for the count, so bar heights stay
     exactly proportional and the tallest count never gets clipped. */
  .col {
    height: 100%;
    padding-top: 24px;
    display: flex;
    justify-content: center;
    align-items: flex-end;
    min-height: 0;
  }

  .count {
    position: absolute;
    bottom: 100%;
    left: 50%;
    transform: translateX(-50%);
    margin-bottom: 4px;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .count.zero { color: var(--muted); }

  .bar {
    position: relative;
    width: 100%;
    max-width: 72px;
    border-radius: 4px 4px 0 0;
    min-height: 2px;
    transition: height .3s ease;
  }

  .labels {
    display: grid;
    grid-template-columns: repeat(var(--n), 1fr);
    gap: 14px;
    margin-top: 6px;
  }

  .lbl {
    text-align: center;
    font-weight: 600;
    line-height: 1.25;
  }
  .lbl .pct {
    display: block;
    color: var(--muted);
    font-weight: 400;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    margin-top: 2px;
  }

  #empty { color: var(--muted); padding: 20px 0; }

  @media (prefers-reduced-motion: reduce) { .bar { transition: none; } }
</style>
</head>
<body>

<div id="total"></div>
<div id="chart"></div>

<script>
  // Fixed display order and color per category. Anything the data contains
  // that isn't listed here is appended at the end in grey.
  const CATEGORIES = [
    { label: "Trending Down", color: "var(--down)" },
    { label: "At Average",    color: "var(--flat)" },
    { label: "Trending Up",   color: "var(--up)"   },
    { label: "No Baseline",   color: "var(--none)" },
  ];

  const chart = document.getElementById("chart");
  const totalEl = document.getElementById("total");

  function tally(records) {
    const counts = new Map();
    for (const rec of records) {
      const key = (rec.Category === undefined || rec.Category === null || rec.Category === "")
        ? "No Baseline"
        : String(rec.Category);
      counts.set(key, (counts.get(key) || 0) + 1);
    }
    return counts;
  }

  function order(counts) {
    const known = CATEGORIES
      .filter(c => counts.has(c.label))
      .map(c => ({ ...c, count: counts.get(c.label) }));

    const extras = [...counts.keys()]
      .filter(k => !CATEGORIES.some(c => c.label === k))
      .sort()
      .map(k => ({ label: k, color: "var(--none)", count: counts.get(k) }));

    return known.concat(extras);
  }

  function render(records) {
    if (!records || !records.length) {
      chart.innerHTML = '<div id="empty">No rows to summarize.</div>';
      totalEl.textContent = "";
      return;
    }

    const rows = order(tally(records));
    const total = records.length;
    const max = Math.max(...rows.map(r => r.count), 1);

    totalEl.textContent = total + " facilities";

    const cols = rows.map(r => {
      const height = (r.count / max) * 100;
      return `
        <div class="col" title="${escapeHtml(r.label)}: ${r.count}">
          <div class="bar" style="height:${height}%;background:${r.color}">
            <span class="count${r.count ? "" : " zero"}">${r.count}</span>
          </div>
        </div>`;
    }).join("");

    const labels = rows.map(r => {
      const pct = Math.round((r.count / total) * 100);
      return `<div class="lbl">${escapeHtml(r.label)}<span class="pct">${pct}%</span></div>`;
    }).join("");

    chart.innerHTML = `
      <div class="plot" style="--n:${rows.length}">${cols}</div>
      <div class="labels" style="--n:${rows.length}">${labels}</div>`;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]
    ));
  }

  grist.ready({
    requiredAccess: "read table",
    columns: [
      {
        name: "Category",
        title: "Trend category",
        description: "The Choice or Text column holding the trend classification",
        type: "Choice,Text",
        optional: false,
      },
    ],
  });

  grist.onRecords(records => {
    render(grist.mapColumnNames(records) || []);
  });
</script>

</body>
</html>
